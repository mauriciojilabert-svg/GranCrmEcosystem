<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial,sans-serif"><rect width="1200" height="700" fill="#f3f4f7"/><rect width="180" height="700" fill="white"/><text x="25" y="45" font-size="25" font-weight="700" fill="#283c50">inTouch</text><text x="205" y="48" font-size="18" font-weight="700" fill="#283c50">Nuevo SLA</text><rect x="205" y="85" width="690" height="555" rx="12" fill="white" stroke="#e1e5ed"/><text x="235" y="130" font-size="18" font-weight="700" fill="#283c50">Detalles de configuración SLA</text><g font-size="13" fill="#1f4268" font-weight="700"><text x="235" y="180">Categoría *</text><text x="235" y="255">Subcategoría</text><text x="235" y="335">Tiempo de respuesta (minutos) *</text><text x="540" y="335">Tiempo de Cierre *</text><text x="235" y="455">Descripción</text></g><g fill="white" stroke="#d9dee8"><rect x="235" y="195" width="625" height="40" rx="5"/><rect x="235" y="270" width="625" height="40" rx="5"/><rect x="235" y="350" width="300" height="40" rx="5"/><rect x="550" y="350" width="310" height="40" rx="5"/><rect x="235" y="470" width="625" height="70" rx="5"/></g><text x="255" y="220" font-size="13" fill="#526176">-- Selecciona categoría -- ▾</text><text x="255" y="295" font-size="13" fill="#526176">-- Toda la categoría (SLA general) -- ▾</text><text x="255" y="375" font-size="13" fill="#526176">60</text><text x="570" y="375" font-size="13" fill="#526176">4 Hrs        0 Min</text><rect x="935" y="85" width="230" height="300" rx="12" fill="white" stroke="#e1e5ed"/><text x="960" y="130" font-size="16" font-weight="700" fill="#3856d8">ⓘ Guía de configuración</text><g font-size="12" fill="#38536f"><text x="960" y="170">• SLA general: categoría completa</text><text x="960" y="200">• SLA específico: subcategoría</text><text x="960" y="230">• Subcategoría tiene precedencia</text><text x="960" y="260">• Plataforma BI opcional</text><text x="960" y="315" font-weight="700">Tiempos sugeridos:</text><text x="960" y="345">Crítico: 15min / 45min</text><text x="960" y="375">Alto: 30min / 1h</text></g><text x="600" y="675" text-anchor="middle" font-size="13" fill="#6b7591">Ilustración del formulario Nuevo SLA</text></svg>
